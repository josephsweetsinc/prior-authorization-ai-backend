name: Clean up Dev disk space

# Manual recovery tool: frees disk space on the Dev box when a deploy
# fails with "no space left on device" (Docker image layers from
# repeated rebuilds, build cache, and the .env.bak.* snapshots left by
# configure-ringcentral-dev.yml all accumulate over time and are never
# cleaned up automatically between deploys - deploy-changes-to-dev.yml
# only prunes Docker, not those backup files).
#
# Safe to run any time: removes only reclaimable Docker build
# cache/unused images/volumes and old .env.bak.* snapshots, never the
# live .env or anything application data depends on.

on:
  workflow_dispatch:

env:
  ENVIRONMENT: dev

jobs:
  clean-disk:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get ssh key
      run: |
        echo "${{ secrets.SSH_KEY }}" > ../id_ed25519
        chmod 600 ../id_ed25519

    - name: Get repo name
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

    - name: Get ec2 instance IP
      run: |
        PUBLIC_IP=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.REPO_NAME }}-${{ env.ENVIRONMENT }}" "Name=instance-state-name,Values=running" \
          --query "Reservations[0].Instances[0].PublicIpAddress" \
          --output text)

        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

    - name: Clean up disk space
      run: |
        ssh -o StrictHostKeyChecking=no -i ../id_ed25519 ubuntu@${{ env.PUBLIC_IP }} << 'EOF'
        cd ~/prior-authorization-ai-backend
        echo "--- Disk usage before ---"
        df -h /
        echo "--- Removing old .env.bak.* snapshots ---"
        rm -fv .env.bak.*
        echo "--- Pruning Docker (images, containers, build cache, volumes not in use) ---"
        docker system prune -af --volumes
        docker builder prune -af
        echo "--- Disk usage after ---"
        df -h /
        EOF
