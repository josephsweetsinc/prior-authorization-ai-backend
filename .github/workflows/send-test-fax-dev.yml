name: Send test fax on Dev

# Manual diagnostic tool: runs scripts/send_test_fax.py inside the Dev
# paai_api container over SSH, sending a real fax through RingCentral
# to the given number - end-to-end verification of the inbound fax
# pipeline (RingCentral -> webhook -> auto-drafted request).

on:
  workflow_dispatch:
    inputs:
      to_number:
        description: 'Destination fax number (E.164, e.g. +15551234567)'
        required: true

env:
  ENVIRONMENT: dev

jobs:
  send-test-fax:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get ssh key
      run: |
        echo "${{ secrets.SSH_KEY }}" > ../id_ed25519
        chmod 600 ../id_ed25519

    - name: Get repo name
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

    - name: Get ec2 instance IP
      run: |
        PUBLIC_IP=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.REPO_NAME }}-${{ env.ENVIRONMENT }}" "Name=instance-state-name,Values=running" \
          --query "Reservations[0].Instances[0].PublicIpAddress" \
          --output text)

        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

    - name: Send test fax
      run: |
        ssh -o StrictHostKeyChecking=no -i ../id_ed25519 ubuntu@${{ env.PUBLIC_IP }} << EOF
        cd ~/${{ env.REPO_NAME }}
        docker compose exec -T paai_api uv run python scripts/send_test_fax.py "${{ inputs.to_number }}"
        EOF
