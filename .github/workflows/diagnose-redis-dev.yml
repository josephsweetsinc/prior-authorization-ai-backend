name: Diagnose Redis connectivity on Dev

# Manual, read-only diagnostic tool: checks whether paai_api can
# actually reach the redis container right now - container status,
# the REDIS_URL paai_api sees at runtime, and a live TCP connection
# attempt from inside paai_api to redis:6379. Added to debug a
# recurring "Connection refused" error from paai_api's Celery
# producer side, despite compose.yml correctly setting REDIS_URL and
# both containers starting up cleanly.
#
# Makes no changes to anything - safe to run any time.

on:
  workflow_dispatch:

env:
  ENVIRONMENT: dev

jobs:
  diagnose-redis:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get ssh key
      run: |
        echo "${{ secrets.SSH_KEY }}" > ../id_ed25519
        chmod 600 ../id_ed25519

    - name: Get repo name
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

    - name: Get ec2 instance IP
      run: |
        PUBLIC_IP=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.REPO_NAME }}-${{ env.ENVIRONMENT }}" "Name=instance-state-name,Values=running" \
          --query "Reservations[0].Instances[0].PublicIpAddress" \
          --output text)

        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

    - name: Check Redis connectivity from paai_api
      run: |
        ssh -o StrictHostKeyChecking=no -i ../id_ed25519 ubuntu@${{ env.PUBLIC_IP }} << 'EOF'
        cd ~/prior-authorization-ai-backend
        echo "--- raw kombu Connection test, bypassing Celery entirely ---"
        docker compose exec -T paai_api uv run python -c "
        import kombu
        print('kombu version:', kombu.__version__)
        conn = kombu.Connection('redis://redis:6379/0')
        print('transport_cls:', conn.transport_cls)
        print('hostname seen by kombu:', conn.hostname)
        print('port seen by kombu:', conn.port)
        try:
            conn.connect()
            print('RAW KOMBU CONNECT SUCCEEDED')
        except Exception as e:
            print('RAW KOMBU CONNECT FAILED:', repr(e))
        " < /dev/null
        echo "--- does celery_app.conf have broker_transport set to something odd? ---"
        docker compose exec -T paai_api uv run python -c "
        from config.celery import celery_app
        print('broker_url:', celery_app.conf.broker_url)
        print('broker_read_url:', celery_app.conf.broker_read_url)
        print('broker_write_url:', celery_app.conf.broker_write_url)
        print('result_backend:', celery_app.conf.result_backend)
        print('task_always_eager:', celery_app.conf.task_always_eager)
        conn = celery_app.connection_for_write()
        print('celery connection_for_write hostname:', conn.hostname)
        print('celery connection_for_write transport_cls:', conn.transport_cls)
        " < /dev/null
        EOF
